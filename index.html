<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamXItch - Toko Game Independen</title>
    <style>
        :root {
            --steam-dark: #1b2838;
            --steam-blue: #2a475e;
            --steam-light-blue: #66c0f4;
            --steam-bg: #171a21;
            --steam-card: #16202d;
            --steam-green: #5c7e10;
            --steam-green-hover: #7ea61a;
            --steam-input: #101822;
        }

        body {
            font-family: 'Motiva Sans', Arial, sans-serif;
            background-color: var(--steam-bg);
            color: #c7d5e0;
            margin: 0;
            padding: 0;
        }

        /* NAVIGATION BAR */
        header {
            background-color: var(--steam-bg);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #23262e;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .logo span { color: var(--steam-light-blue); }

        nav button {
            background-color: var(--steam-blue);
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        nav button:hover {
            background-color: var(--steam-light-blue);
        }

        /* KONTEN UTAMA */
        main {
            padding: 40px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HALAMAN 1: TOKO UTAMA */
        #halamanToko h2 {
            color: #fff;
            font-size: 22px;
            border-bottom: 2px solid var(--steam-blue);
            padding-bottom: 10px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .game-card {
            background-color: var(--steam-card);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .game-card:hover {
            border-color: var(--steam-light-blue);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .game-thumb {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #2a475e, #1b2838);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--steam-light-blue);
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .game-info { padding: 15px; }
        .game-title {
            color: #fff;
            font-size: 16px;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .game-dev { font-size: 12px; color: #66c0f4; margin-bottom: 15px; }
        .game-footer { display: flex; justify-content: space-between; align-items: center; }
        .game-price {
            font-weight: bold;
            color: #a3d200;
            background-color: rgba(92,126,16,0.2);
            padding: 3px 8px;
            border-radius: 2px;
            font-size: 14px;
        }

        /* HALAMAN 2: DASHBOARD UPLOAD GAME */
        #halamanUpload {
            display: none; /* Sembunyi di awal */
            max-width: 700px;
            margin: 0 auto;
            background-color: var(--steam-card);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid var(--steam-blue);
        }

        #halamanUpload h2 {
            color: #fff;
            margin-top: 0;
            margin-bottom: 5px;
        }
        .sub-title {
            color: #8f98a0;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #fff;
            font-weight: bold;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--steam-input);
            border: 1px solid #23262e;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--steam-light-blue);
            outline: none;
        }

        /* AREA UNGGUH BERKAS */
        .drop-zone {
            border: 2px dashed var(--steam-blue);
            padding: 30px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .drop-zone:hover {
            border-color: var(--steam-light-blue);
        }
        .drop-zone p { margin: 5px 0; font-size: 14px; color: #8f98a0; }
        .drop-zone b { color: #fff; }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 35px;
        }
        .btn-publish {
            background-color: var(--steam-green);
            color: white;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            flex: 2;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .btn-publish:hover { background-color: var(--steam-green-hover); }
        .btn-back {
            background-color: #3d4450;
            color: #fff;
            border: none;
            padding: 15px 25px;
            border-radius: 4px;
            cursor: pointer;
            flex: 1;
            font-size: 15px;
        }
        .btn-back:hover { background-color: #4c5463; }
    </style>
</head>
<body>

    <!-- NAVIGASI KEPALA -->
    <header>
        <div class="logo" onclick="tampilkanToko()">STEAM<span>ITCH</span></div>
        <nav id="navAksi">
            <button onclick="tampilkanUpload()">🟢 Upload Game</button>
        </nav>
    </header>

    <main>
        <!-- ==================== VIEW 1: TOKO UTAMA ==================== -->
        <div id="halamanToko">
            <h2>Game Populer Terbaru</h2>
            <div class="game-grid" id="daftarGame">
                <!-- Game bawaan simulasi -->
                <div class="game-card">
                    <div class="game-thumb">Cyber Knight</div>
                    <div class="game-info">
                        <p class="game-title">Cyber Knight: Neon City</p>
                        <div class="game-dev">Dev: Alpha Games</div>
                        <div class="game-footer">
                            <span class="game-price">Rp 45.000</span>
                        </div>
                    </div>
                </div>
                <div class="game-card">
                    <div class="game-thumb">Pixel Dungeon</div>
                    <div class="game-info">
                        <p class="game-title">Pixel Dungeon Explorer</p>
                        <div class="game-dev">Dev: IndieStudio</div>
                        <div class="game-footer">
                            <span class="game-price">Gratis</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== VIEW 2: HALAMAN UPLOAD GAME ==================== -->
        <div id="halamanUpload">
            <h2>Dashboard Pembuat Halaman Game</h2>
            <div class="sub-title">Unggah file game Anda dan terbitkan langsung ke jaringan toko SteamItch.</div>
            
            <form id="gameForm" onsubmit="terbitkanGameBaru(event)">
                <div class="form-group">
                    <label for="judul">Judul Game</label>
                    <input type="text" id="judul" placeholder="Masukkan judul projek game Anda..." required>
                </div>
                
                <div class="form-group">
                    <label for="developer">Nama Kreator / Developer</label>
                    <input type="text" id="developer" placeholder="Contoh: Studio Kita Game" required>
                </div>

                <div class="form-group">
                    <label for="deskripsi">Deskripsi Singkat Game</label>
                    <textarea id="deskripsi" rows="3" placeholder="Ceritakan keseruan game Anda dalam beberapa kalimat..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="harga">Pengaturan Harga</label>
                    <select id="harga">
                        <option value="Gratis">Gratis / Free-to-Play</option>
                        <option value="Rp 19.000">Rp 19.000</option>
                        <option value="Rp 49.000">Rp 49.000</option>
                        <option value="Rp 89.000">Rp 89.000</option>
                        <option value="Rp 135.000">Rp 135.000</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Berkas Build Game (.zip / .exe)</label>
